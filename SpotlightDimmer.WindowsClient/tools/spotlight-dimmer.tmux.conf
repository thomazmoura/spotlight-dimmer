# SpotlightDimmer tmux integration hooks (Windows/WSL)
#
# Reports the focused pane's geometry to the SpotlightDimmer Windows client
# whenever it may have changed, so the client can spotlight the focused tmux
# pane instead of the whole terminal window.
#
# Setup (inside WSL):
#   1. Copy spotlight-dimmer-tmux-report.sh to ~/.config/SpotlightDimmer/tools/
#      and make it executable (or adjust the path below to your location).
#   2. Add to ~/.tmux.conf:
#        source-file ~/.config/SpotlightDimmer/tools/spotlight-dimmer.tmux.conf
#   3. Reload tmux: tmux source-file ~/.tmux.conf
#
# Note: `set-hook -g` REPLACES any existing global hook for the same event.
# If you already use one of these hooks, merge the run-shell command into your
# existing hook (or use `set-hook -ag` to append).

# Keep the terminal join hints fresh in the tmux session environment: the tmux
# server environment is frozen at server start, but WT_SESSION / WEZTERM_PANE
# identify the terminal PANE the client is attached to, which changes across
# attaches. (Requires WSLENV to propagate them into WSL; see the docs.)
set-option -ga update-environment ' WT_SESSION WEZTERM_PANE'

# Focused pane changed
set-hook -g after-select-pane 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'

# Active window changed (different window = different pane layout)
set-hook -g after-select-window 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'
set-hook -g session-window-changed 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'

# Pane layout changed
set-hook -g after-split-window 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'
set-hook -g after-resize-pane 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'
set-hook -g after-kill-pane 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'
set-hook -g window-pane-changed 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'

# Pane entered/exited a mode (choose-tree via prefix+s/w, copy-mode, ...).
# The default choose-tree bindings use -Z, which zooms the active pane while
# the chooser is open, so geometry must be re-reported on entry and exit.
set-hook -g pane-mode-changed 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'

# Window layout changed without one of the hooked commands running
# (zoom/unzoom, next-layout, ...)
set-hook -g window-layout-changed 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'

# Client lifecycle: initial report on attach, terminal resize, session switch
set-hook -g client-attached 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'
set-hook -g client-resized 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'
set-hook -g client-session-changed 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"'

# Client detached / tmux exiting: clear the stored geometry so the spotlight
# widens back to the whole window (the Windows side cannot check tmux client
# liveness the way the Linux daemon does). The detached client is already gone
# when the hook runs, so #{client_tty} expands empty and the script cannot
# query it - #{hook_client} carries the detaching client's tty instead.
set-hook -g client-detached 'run-shell -b "~/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh --clear #{hook_client}"'
