# SpotlightDimmer tmux integration hooks
#
# Reports the focused pane's geometry to the SpotlightDimmer GNOME Shell
# extension whenever it may have changed, so the extension can spotlight the
# focused tmux pane instead of the whole terminal window.
#
# Setup:
#   1. Copy spotlight-dimmer-tmux-report.sh to ~/.config/SpotlightDimmer/tools/
#      and make it executable (or adjust the path below to the repo checkout).
#   2. Add to ~/.tmux.conf:
#        source-file ~/.config/SpotlightDimmer/tools/spotlight-dimmer.tmux.conf
#   3. Reload tmux: tmux source-file ~/.tmux.conf
#
# Hook registration is APPEND-AND-PROBE rather than a plain `set-hook -g`.
#
# `set-hook -g` assigns the hook, REPLACING the whole array for that event, so
# it silently deletes entries belonging to any other tool that hooks the same
# event. `set-hook -ag` appends instead -- but appends unconditionally, so it
# stacks up a duplicate every time this file is sourced, and tmux config files
# get sourced more than once in practice (TPM re-sources ~/.tmux.conf while it
# loads plugins). Probing the event first and appending only when our reporter
# is not already registered is both non-destructive and idempotent.

# The events, and why each one is needed:
#   after-select-pane       focused pane changed
#   after-select-window     active window changed (different pane layout)
#   session-window-changed    "
#   after-split-window      pane layout changed
#   after-resize-pane         "
#   after-kill-pane           "
#   window-pane-changed       "
#   pane-mode-changed       pane entered/exited a mode (choose-tree via
#                           prefix+s/w, copy-mode, ...). The default choose-tree
#                           bindings use -Z, which zooms the active pane while
#                           the chooser is open, so geometry must be re-reported
#                           on entry and exit.
#   window-layout-changed   layout changed without one of the hooked commands
#                           running (zoom/unzoom, next-layout, ...)
#   client-attached         client lifecycle: initial report on attach,
#   client-resized          terminal resize,
#   client-session-changed  and session switch
run-shell -b 'report="$HOME/.config/SpotlightDimmer/tools/spotlight-dimmer-tmux-report.sh"; \
  for hook in after-select-pane after-select-window session-window-changed \
              after-split-window after-resize-pane after-kill-pane \
              window-pane-changed pane-mode-changed window-layout-changed \
              client-attached client-resized client-session-changed; do \
    tmux show-options -g "$hook" 2>/dev/null | grep -q spotlight-dimmer-tmux-report \
      || tmux set-hook -ag "$hook" "run-shell -b $report"; \
  done'

# --- Ghostty (and any terminal without a pane-query CLI) -------------------
#
# WezTerm is asked over `wezterm cli` which pane is focused and which tty it
# owns. Ghostty has no such CLI, so tmux publishes the tty itself, in the
# window title. Uncomment the two lines below and set
#   "TtySource": "title"
# on that terminal's AppIntegrations entry in config.json.
#
# The marker starts with U+2063 INVISIBLE SEPARATOR, which renders as nothing,
# so the title still looks untouched in the window list / Alt-Tab. The rest of
# the string is tmux's own default set-titles-string: replace it with yours if
# you have customized it, keeping the marker at the end.
#
# set -g set-titles on
# set -g set-titles-string '#S:#I:#W - "#T" #{session_alerts}⁣sd:#{client_tty}'
